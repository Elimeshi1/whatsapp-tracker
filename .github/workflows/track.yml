name: WhatsApp Beta Tracker

on:
  schedule:
    # Every 3 hours. Adjust as you like (cron is in UTC).
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional direct APK URL for Android (e.g. an APKMirror beta link). Leave empty to use APKPure."
        required: false
        default: ""

permissions:
  contents: write

# Never let two runs commit on top of each other.
concurrency:
  group: wa-tracker
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool & baksmali
        run: |
          curl -fSL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -fSL -o baksmali.jar \
            https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar

      - name: Download WhatsApp beta APK
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: bash scripts/download_android.sh artifacts

      - name: Decode resources (no smali = fast)
        run: java -jar apktool.jar d -s -f -o decoded artifacts/WhatsApp.apk

      - name: Disassemble code (maps each string to its feature module)
        # baksmali turns the dex into smali so extract can tie a string's
        # resource id to the readable com/whatsapp class that references it.
        # Non-fatal: if it fails, extraction proceeds without module labels.
        continue-on-error: true
        run: |
          mkdir -p smali
          for dex in decoded/classes*.dex; do
            java -jar baksmali.jar d "$dex" -o smali || true
          done
          echo "smali classes: $(find smali -name '*.smali' | wc -l)"

      - name: Extract strings & flags
        run: python3 scripts/extract_android.py decoded artifacts/android-extract.json smali

      - name: Extract readable class/method names (code surface)
        # Reads the dex method table straight out of the APK — no apktool/baksmali
        # needed. A new readable com.whatsapp class/method is a strong new-feature
        # signal that usually lands before any UI text. Version is read from the
        # apktool.yml the decode step produced.
        run: |
          VER=$(sed -nE "s/^[[:space:]]*versionName:[[:space:]]*['\"]?([^'\"]+).*/\1/p" decoded/apktool.yml | head -1)
          VC=$(sed -nE "s/^[[:space:]]*versionCode:[[:space:]]*['\"]?([^'\"]+).*/\1/p" decoded/apktool.yml | head -1)
          echo "code surface for v$VER ($VC)"
          python3 scripts/extract_methods.py artifacts/WhatsApp.apk artifacts/android-methods.json "$VER" "$VC"

      - uses: actions/upload-artifact@v4
        with:
          name: android-extract
          path: artifacts/android-extract.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-methods
          path: artifacts/android-methods.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download WhatsApp Mac beta
        run: bash scripts/download_mac.sh artifacts

      - name: Extract strings
        run: python3 scripts/extract_mac.py artifacts/WhatsApp-mac.dmg artifacts/mac-extract.json

      - uses: actions/upload-artifact@v4
        with:
          name: mac-extract
          path: artifacts/mac-extract.json
          if-no-files-found: error

  report:
    needs: [android, macos]
    # Run even if one platform job failed, so the other still gets reported.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect platform extracts
        uses: actions/download-artifact@v4
        with:
          path: incoming
        continue-on-error: true

      - name: Diff & generate reports
        id: diff
        run: python3 scripts/diff_and_report.py

      - name: Commit results
        run: |
          git config user.name "wa-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "track: ${{ steps.diff.outputs.summary || 'update' }}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Notify (Telegram)
        if: steps.diff.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify.py

# tracker: WhatsApp beta (Android + Mac)
